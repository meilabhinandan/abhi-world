 <h4 style="margin-top:22px">Backup & Recovery</h4><p style="color:var(--mu);font-size:13px">Your data is saved in the owner's Google Sheet. You can also download a backup file.</p><div class="row"><button class="btn ghost" id="bk">Download Backup (.json)</button><label class="btn ghost" style="margin:0">Restore my records<input id="rs" type="file" accept=".json" hidden></label></div></div>`;
 $('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('bm_theme',t)};$('#lg').onclick=logout;
 $('#cp').onclick=()=>modal('Change Password',field('Current password','cur','','password','required')+field('New password (min 6)','nw','','password','required minlength=6'),'Update',async d=>{const r=await api('pw',d);TOKEN=r.token;localStorage.setItem('bm_t',TOKEN);note(`${tick}<h3>Password changed</h3>`,1800)});
 $('#bk').onclick=async()=>{try{const d=await api('export',{ids:me.role==='owner'?undefined:[me.id]});d.exported=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='budget-backup-'+today()+'.json';a.click()}catch(e){note(`<h3>Backup failed</h3><p>${esc(e.message)}</p>${OK}`)}};
 $('#rs').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{let d;try{d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0}catch{return note(`<h3>Invalid backup file</h3>${OK}`)}
  modal('Restore my records?','<p>Your current transactions will be replaced by the ones in this file.</p>','Restore',async()=>{const mine=d.tx.filter(x=>x.userId===me.id);const r=await api('tx.restore',{tx:mine});note(`${tick}<h3>${r.n} records restored</h3>`,1800);go('dashboard')})})}}

// ---- admin ----
async function adminPage(){view=null;const us=(await api('admin.users')).users,a=us.filter(u=>u.active).length,I=sum(us.map(u=>({amount:u.income}))),E=sum(us.map(u=>({amount:u.expense})));
 $('#view').innerHTML=`<div class="grid">${[['TOTAL MEMBERS',us.length],['ACTIVE',a],['INACTIVE',us.length-a],['COMBINED INCOME',inr(I)],['COMBINED EXPENSES',inr(E)],['COMBINED BALANCE',inr(I-E)]].map(c=>`<div class="glass card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div>
 <div class="glass p"><div class="row" style="margin-bottom:12px"><button class="btn" id="nm">+ Create Member</button><span style="color:var(--mu)">Combined report:</span>${['xlsx','docx','pdf'].map(f=>`<button class="btn sm ghost" data-all="${f}">${f.toUpperCase()}</button>`).join('')}</div>
 <div class="tw"><table><tr><th>NAME</th><th>USER ID</th><th>STATUS</th><th>INCOME</th><th>EXPENSE</th><th>BALANCE</th><th>CREATED</th><th>ACTIONS</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.uid)}</td><td><span class="chip ${u.active?'on':'off'}">${u.active?'Active':'Inactive'}</span></td><td>${inr(u.income)}</td><td>${inr(u.expense)}</td><td>${inr(u.income-u.expense)}</td><td>${esc(u.created)}</td><td><button class="btn sm" data-v="${u.id}">View Details</button> ${['xlsx','docx','pdf'].map(f=>`<button class="btn sm ghost" data-r="${u.id}" data-f="${f}">${f}</button>`).join(' ')} <button class="btn sm ghost" data-ed="${u.id}">Edit</button> <button class="btn sm red" data-del="${u.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=8>No members yet</td></tr>'}</table></div></div>`;
 $('#nm').onclick=()=>modal('Create Member',field('Full name','name','','text','required')+field('User ID (blank = auto)','uid')+field('Password (blank = auto generate, min 6)','password'),'Create',async d=>{
  const r=await api('admin.create',d);await adminPage();note(`${tick}<h3>Member created</h3><p>User ID: <b>${esc(r.uid)}</b><br>Password: <b>${esc(r.password)}</b></p><p style="color:var(--mu)">Save this now. The password cannot be viewed again.</p>${OK}`)});
 $('#view').onclick=e=>{const b=e.target.closest('button');if(!b)return;const u=us.find(x=>x.id===(b.dataset.v||b.dataset.r||b.dataset.ed||b.dataset.del));
  if(b.dataset.all)dl(b.dataset.all,'','',us.map(x=>x.id),true);else if(b.dataset.r)dl(b.dataset.f,'','',[u.id],false);else if(b.dataset.v){view=u;go('dashboard')}
  else if(b.dataset.ed)modal('Edit Member',field('Name','name',u.name,'text','required')+field('New password (blank = keep)','password')+`<label><input type="checkbox" name="active" ${u.active?'checked':''} style="width:auto"> Account active</label>`,'Save',async d=>{await api('admin.update',{id:u.id,name:d.name,active:!!d.active,password:d.password||undefined});adminPage()})
  else if(b.dataset.del)modal('Delete member?',`<p>Delete <b>${esc(u.name)}</b> and ALL their records permanently?</p>`,'Delete',async()=>{await api('admin.delete',{id:u.id});adminPage()})}}
</script></body></html>
