<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PartySplit – Smart Bill Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f1ec;--bg2:#e9e5da;--card:rgba(255,255,255,.85);--tx:#16213a;--mu:#6b7385;--bd:rgba(22,33,58,.1);--ac:#c8993a;--ac2:#e6c06b;--gr:#14a36b;--rd:#d6455d;--sh:0 8px 30px rgba(22,33,58,.1);--in:#fff}
:root[data-theme=dark]{--bg:#0b1226;--bg2:#141d3a;--card:rgba(255,255,255,.06);--tx:#eef1f8;--mu:#97a0b8;--bd:rgba(255,255,255,.1);--sh:0 8px 30px rgba(0,0,0,.4);--in:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 500px at 80% -10%,var(--bg2),transparent),var(--bg);color:var(--tx);padding-bottom:90px}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px;max-width:1000px;margin:auto}
.logo{font-size:24px;font-weight:700}.logo span{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:1000px;margin:auto;padding:0 16px}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;animation:in .35s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-size:26px;font-family:'Playfair Display',serif;margin-top:4px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter;cursor:pointer;color:var(--tx);background:var(--in);border:1px solid var(--bd);transition:.2s;min-height:44px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1405;border:0}
.big{width:100%;padding:18px;font-size:17px}
.dng{color:var(--rd)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:16px Inter;min-height:44px}
label{font-size:13px;color:var(--mu);display:block;margin:12px 0 5px}
.err{color:var(--rd);font-size:13px;margin-top:5px;animation:in .2s}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.pc{display:flex;align-items:center;gap:12px;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}
.pos{color:var(--gr);font-weight:600}.neg{color:var(--rd);font-weight:600}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--in);border:1px solid var(--bd);font-size:12px;margin:2px}
.chip.no{opacity:.5;text-decoration:line-through}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st.done{opacity:.6}.st.done .tr{text-decoration:line-through}
.tr{font-weight:600}.arr{color:var(--ac);display:inline-block;animation:nudge 1.4s infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.ready{text-align:center;background:linear-gradient(135deg,rgba(200,153,58,.25),rgba(20,163,107,.15))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font:500 11px Inter;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;cursor:pointer;border-radius:10px;min-height:44px}
nav button span{font-size:20px}nav button.on{color:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(5,9,22,.6);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
#ov.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);color:var(--tx);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px;animation:up .3s ease;border:1px solid var(--bd)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(min-width:700px){#ov{align-items:center}.modal{border-radius:22px}}
.ck{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;margin:5px 0;cursor:pointer;background:var(--in);transition:.15s}
.ck input{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.ck:has(input:checked){border-color:var(--ac);transform:scale(1.01)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:var(--gr);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.35s;z-index:20;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--rd)}
.tick{width:64px;height:64px;margin:auto}.tick circle,.tick path{stroke:var(--gr);stroke-width:4;fill:none;stroke-dasharray:200;stroke-dashoffset:200;animation:dr .7s .1s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.empty{text-align:center;color:var(--mu);padding:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="logo serif">Party<span>Split</span></div>
<div class="row"><button class="btn" id="th" aria-label="Toggle theme">🌙</button><button class="btn" id="np">🔄 New Party</button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"><div class="modal" id="md"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const newBillId=()=>'PS-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const def=()=>({people:[],expenses:[],paid:{},billId:newBillId()});
let S,H=[],theme='dark',tab='dash';
try{S=JSON.parse(localStorage.getItem('ps_state'))||def();H=JSON.parse(localStorage.getItem('ps_hist'))||[];theme=localStorage.getItem('ps_theme')||'dark'}catch(e){S=def()}
const hsh=(s,seed=7)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const ADMIN=8677180789897937;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem('ps_state',JSON.stringify(S));localStorage.setItem('ps_hist',JSON.stringify(H));localStorage.setItem('ps_theme',theme)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});
const rs=p=>'Rs. '+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const nm=(b,id)=>(b.people.find(p=>p.id===id)||{name:'?'}).name;
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 55% 45%)`};
const av=n=>`<div class="av" style="background:${col(n)}">${esc(n.trim()[0]||'?').toUpperCase()}</div>`;
const icon=n=>{n=n.toLowerCase();return/food|dinner|lunch|snack|pizza|biryani/.test(n)?'🍛':/sprite|drink|cola|juice|water/.test(n)?'🥤':/beer|wine|whisky|alcohol|bar/.test(n)?'🍺':/cig|smoke/.test(n)?'🚬':/taxi|cab|fuel|petrol|travel|uber/.test(n)?'🚕':/hotel|room|stay/.test(n)?'🏨':/shop/.test(n)?'🛍️':'💰'};

/* ---------- calculation engine (integer paise) ---------- */
function split(amt,ids){const n=ids.length,b=Math.floor(amt/n);let r=amt-b*n;const o={};ids.forEach(i=>{o[i]=b+(r-->0?1:0)});return o}
function calc(b){
  const share={},paid={},bal={};b.people.forEach(p=>{share[p.id]=0;paid[p.id]=0});
  let total=0;
  b.expenses.forEach(e=>{total+=e.amt;if(paid[e.paidBy]!==undefined)paid[e.paidBy]+=e.amt;const s=split(e.amt,e.cons);for(const i in s)if(share[i]!==undefined)share[i]+=s[i]});
  b.people.forEach(p=>bal[p.id]=paid[p.id]-share[p.id]);
  const cr=[],db=[];b.people.forEach(p=>{if(bal[p.id]>0)cr.push({id:p.id,v:bal[p.id]});else if(bal[p.id]<0)db.push({id:p.id,v:-bal[p.id]})});
  const settle=[];
  while(cr.length&&db.length){cr.sort((a,c)=>c.v-a.v);db.sort((a,c)=>c.v-a.v);const c=cr[0],d=db[0],x=Math.min(c.v,d.v);settle.push({from:d.id,to:c.id,amt:x});c.v-=x;d.v-=x;if(!c.v)cr.shift();if(!d.v)db.shift()}
  return{share,paid,bal,total,settle}
}
const skey=t=>t.from+'>'+t.to+'>'+t.amt;

/* ---------- UI helpers ---------- */
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('show')}
function closeM(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function count(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0)}
function applyTheme(){document.documentElement.dataset.theme=theme;$('#th').textContent=theme==='dark'?'☀️':'🌙'}
$('#th').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();save()};
$('#np').onclick=()=>modal(`<h2>Start new bill?</h2><p style="margin:12px 0;color:var(--mu)">Are you sure you want to start a new bill? Current data will be cleared.</p><div class="row"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="newBill()">Start New Bill</button></div>`);
function newBill(){if(S.expenses.length&&!H.some(h=>h.billId===S.billId)){const s=JSON.parse(JSON.stringify(S));s.date=new Date().toISOString();H.unshift(s)}S=def();save();closeM();go('dash');toast('New bill started')}
const TABS=[['dash','🏠','Home'],['people','👥','People'],['exp','💰','Expenses'],['set','💸','Settle'],['hist','🕘','History']];
function go(t){tab=t;render();scrollTo({top:0,behavior:'smooth'})}
function render(){
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  const v={dash:vDash,people:vPeople,exp:vExp,set:vSet,hist:vHist}[tab]();
  $('#app').innerHTML=`<div class="view">${v}</div>`;
  const c=$('#cnt');if(c)count(c,+c.dataset.v);
  save();
}

/* ---------- views ---------- */
function addBtn(){return`<button class="btn pri big" onclick="openExp()">＋ Add Expense</button>`}
function balTable(b,c){return`<div class="wrap"><table><tr><th>Person</th><th>Share</th><th>Paid</th><th>Balance</th></tr>${b.people.map(p=>{const x=c.bal[p.id];return`<tr><td>${esc(p.name)}</td><td>${fmt(c.share[p.id])}</td><td>${fmt(c.paid[p.id])}</td><td class="${x>0?'pos':x<0?'neg':''}">${x>0?'🟢 +':x<0?'🔴 ':''}${x?fmt(x):'Settled'}</td></tr>`}).join('')}</table></div>`}
function vDash(){
  const c=calc(S),n=S.people.length;
  let h=`<div class="grid"><div class="card stat"><small>Total Bill</small><b id="cnt" data-v="${c.total}">${fmt(c.total)}</b></div><div class="card stat"><small>People</small><b>${n}</b></div><div class="card stat"><small>Expenses</small><b>${S.expenses.length}</b></div><div class="card stat"><small>Avg per person</small><b>${n?fmt(Math.round(c.total/n)):'₹0'}</b></div></div>`;
  if(n<2)h+=`<div class="card empty">Start by adding at least 2 people.<br><br><button class="btn pri" onclick="go('people')">👥 Add People</button></div>`;
  else h+=addBtn()+'<div style="height:14px"></div>';
  if(S.expenses.length&&n){h+=`<div class="card ready"><h2>Your Bill is Ready 🎉</h2><p style="margin:6px 0 14px">Total: <b>${fmt(c.total)}</b></p><div class="row" style="justify-content:center"><button class="btn" onclick="go('set')">👀 View Full Bill</button><button class="btn pri" onclick="dl(S)">📄 Download Bill PDF</button></div></div><div class="card"><h3>Actual share per person</h3>${balTable(S,c)}</div>`}
  return h}
function vPeople(){
  return`<div class="card"><h3>Add Person</h3><div class="row" style="flex-wrap:nowrap;margin-top:10px"><input id="pn" placeholder="Name e.g. Rahul" maxlength="30" onkeydown="if(event.key==='Enter')addP()"><button class="btn pri" onclick="addP()">Add</button></div><div class="err" id="pe"></div></div>
  <p style="color:var(--mu);margin:0 0 10px">👥 ${S.people.length} people</p>
  ${S.people.map(p=>`<div class="card pc"><div class="row">${av(p.name)}<b>${esc(p.name)}</b></div><div class="row"><button class="btn" onclick="editP('${p.id}')">✏️</button><button class="btn dng" onclick="delP('${p.id}')">🗑️</button></div></div>`).join('')||'<div class="card empty">No people yet</div>'}`}
function dupName(n,ex){return S.people.some(p=>p.id!==ex&&p.name.toLowerCase()===n.toLowerCase())}
function addP(){const n=$('#pn').value.trim(),e=$('#pe');if(!n)return e.textContent='Name cannot be empty.';if(dupName(n))return e.textContent='This name already exists.';S.people.push({id:uid(),name:n});render();$('#pn').focus()}
function editP(id){const p=S.people.find(x=>x.id===id);modal(`<h2>Edit person</h2><input id="en" value="${esc(p.name)}" maxlength="30"><div class="err" id="ee"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveP('${id}')">Save</button></div>`)}
function saveP(id){const n=$('#en').value.trim();if(!n)return $('#ee').textContent='Name cannot be empty.';if(dupName(n,id))return $('#ee').textContent='This name already exists.';S.people.find(x=>x.id===id).name=n;closeM();render()}
function delP(id){
  if(S.expenses.some(e=>e.paidBy===id))return toast('This person paid for an expense. Edit or delete it first.',1);
  if(S.expenses.some(e=>e.cons.length===1&&e.cons[0]===id))return toast('They are the only consumer of an expense. Edit it first.',1);
  S.people=S.people.filter(p=>p.id!==id);S.expenses.forEach(e=>e.cons=e.cons.filter(x=>x!==id));S.paid={};render()}
function vExp(){
  return addBtn()+'<div style="height:14px"></div>'+(S.expenses.map(e=>{const s=split(e.amt,e.cons),pp=Math.min(...Object.values(s)),mx=Math.max(...Object.values(s));
    const out=S.people.filter(p=>!e.cons.includes(p.id));
    return`<div class="card"><div class="pc"><div><h3>${icon(e.name)} ${esc(e.name)}</h3><div style="color:var(--mu);font-size:13px">Paid by <b style="color:var(--tx)">${esc(nm(S,e.paidBy))}</b></div></div><div class="serif" style="font-size:22px">${fmt(e.amt)}</div></div>
    <div style="margin:10px 0">${e.cons.map(i=>`<span class="chip">✓ ${esc(nm(S,i))}</span>`).join('')}${out.map(p=>`<span class="chip no">${esc(p.name)}</span>`).join('')}</div>
    <div style="color:var(--mu);font-size:13px">Per person: <b style="color:var(--tx)">${fmt(pp)}${mx!==pp?' – '+fmt(mx):''}</b> · ${e.cons.length} of ${S.people.length}${out.length?' · Not included: '+out.map(p=>esc(p.name)).join(', '):''}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="openExp('${e.id}')">✏️ Edit</button><button class="btn dng" onclick="delE('${e.id}')">🗑️ Delete</button></div></div>`}).join('')||'<div class="card empty">No expenses yet</div>')}
function delE(id){modal(`<h2>Delete expense?</h2><p style="margin:12px 0;color:var(--mu)">This will update all calculations.</p><div class="row"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="S.expenses=S.expenses.filter(e=>e.id!=='${id}');S.paid={};closeM();render()">Delete</button></div>`)}

/* expense modal */
let EM={};
function openExp(id){
  if(S.people.length<2){toast('Add at least 2 people first',1);return go('people')}
  const e=id?S.expenses.find(x=>x.id===id):null;
  EM={id,cons:new Set(e?e.cons:S.people.map(p=>p.id))};
  modal(`<h2>${e?'Edit':'Add'} Expense</h2>
  <label>Expense name</label><input id="xn" placeholder="Food, Taxi, Beer…" value="${e?esc(e.name):''}" maxlength="40"><div class="err" id="e1"></div>
  <label>Amount (₹)</label><input id="xa" inputmode="decimal" placeholder="0" value="${e?e.amt/100:''}"><div class="err" id="e2"></div>
  <label>Paid by</label><select id="xp"><option value="">Select person</option>${S.people.map(p=>`<option value="${p.id}" ${e&&e.paidBy===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="err" id="e3"></div>
  <label>Who consumed / used this?</label><div class="row" style="margin-bottom:6px"><button class="btn" onclick="selAll(1)">Select All</button><button class="btn" onclick="selAll(0)">Clear All</button></div>
  <div id="cl">${S.people.map(p=>`<label class="ck" style="margin:5px 0;color:var(--tx);font-size:15px"><input type="checkbox" ${EM.cons.has(p.id)?'checked':''} onchange="tg('${p.id}',this.checked)">${esc(p.name)}</label>`).join('')}</div><div class="err" id="e4"></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveE()">${e?'Save Changes':'Add Expense'}</button></div>`)}
function tg(id,on){on?EM.cons.add(id):EM.cons.delete(id)}
function selAll(on){EM.cons=new Set(on?S.people.map(p=>p.id):[]);document.querySelectorAll('#cl input').forEach(i=>i.checked=!!on)}
function saveE(){
  const n=$('#xn').value.trim(),a=Math.round(parseFloat(String($('#xa').value).replace(/,/g,''))*100),p=$('#xp').value;let bad=0;
  const m=(i,t)=>{$(i).textContent=t;if(t)bad=1};
  m('#e1',n?'':'Expense name cannot be empty.');
  m('#e2',isNaN(a)?'Enter a valid amount.':a<=0?'Amount must be greater than zero.':'');
  m('#e3',p?'':'Please select who paid.');
  m('#e4',EM.cons.size?'':'Please select at least one person who consumed this expense.');
  if(bad)return;
  const ex={id:EM.id||uid(),name:n,amt:a,paidBy:p,cons:S.people.filter(x=>EM.cons.has(x.id)).map(x=>x.id)};
  if(EM.id)S.expenses=S.expenses.map(x=>x.id===EM.id?ex:x);else S.expenses.push(ex);
  S.paid={};closeM();render();toast(EM.id?'Expense updated ✓':'Expense added ✓')}

function vSet(){
  if(!S.expenses.length)return'<div class="card empty">Add expenses to see the settlement.</div>';
  const c=calc(S);
  return`<div class="card ready"><h2>🎉 Bill Summary</h2><div class="grid" style="margin:14px 0 0"><div><small>Total</small><br><b class="serif" style="font-size:24px">${fmt(c.total)}</b></div><div><small>People</small><br><b class="serif" style="font-size:24px">${S.people.length}</b></div><div><small>Expenses</small><br><b class="serif" style="font-size:24px">${S.expenses.length}</b></div></div></div>
  <div class="card"><h3>Individual breakdown</h3>${balTable(S,c)}</div>
  <div class="card"><h3>💸 Who Pays Whom?</h3><p style="color:var(--mu);font-size:13px;margin:4px 0 10px">${c.settle.length} transaction${c.settle.length==1?'':'s'} (minimised)</p>
  ${c.settle.map(t=>{const k=skey(t),d=S.paid[k];return`<div class="st card ${d?'done':''}" style="margin:8px 0"><div class="tr">${esc(nm(S,t.from))} <span class="arr">→</span> ${esc(nm(S,t.to))} <span class="neg" style="margin-left:6px">${fmt(t.amt)}</span></div><button class="btn ${d?'pri':''}" onclick="S.paid['${k}']=!S.paid['${k}'];render()">${d?'✓ Paid':'☐ Pending'}</button></div>`}).join('')||'<div class="empty">Everyone is settled 🎉</div>'}</div>
  <div class="row"><button class="btn pri big" onclick="dl(S)">📄 Download Bill PDF</button><button class="btn big" onclick="saveBill()">💾 Save Bill to History</button></div>`}
function saveBill(){const s=JSON.parse(JSON.stringify(S));s.date=new Date().toISOString();H=H.filter(h=>h.billId!==s.billId);H.unshift(s);render();toast('Bill saved to history ✓')}
function vHist(){
  return `<div class="card"><h3>🕘 Bill History</h3><p style="color:var(--mu);font-size:13px;margin:6px 0 12px">Saved bills are kept permanently. Deleting needs the admin password.</p><div class="row"><button class="btn" onclick="exportH()">⬇️ Backup</button><button class="btn" onclick="$('#imp').click()">⬆️ Restore</button><input id="imp" type="file" accept=".json" hidden onchange="importH(this.files[0])"></div></div>`+(H.length?H.map((b,i)=>{const c=calc(b);return`<div class="card"><div class="pc"><div><b>${b.billId}</b><div style="color:var(--mu);font-size:13px">${new Date(b.date).toLocaleString('en-IN')}</div><div style="font-size:13px;margin-top:4px">${b.people.length} people · ${b.expenses.length} expenses</div></div><div class="serif" style="font-size:22px">${fmt(c.total)}</div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="viewH(${i})">View</button><button class="btn" onclick="dl(H[${i}])">📄 PDF</button><button class="btn dng" onclick="askDel(${i})">🔒 Delete</button></div></div>`}).join(''):'<div class="card empty">No saved bills yet. Use “Save Bill to History” in Settle.</div>')}
function askDel(i){modal(`<h2>🔒 Admin approval</h2><p style="margin:10px 0;color:var(--mu)">Enter the admin password to delete bill <b>${esc(H[i].billId)}</b>.</p><input id="pw" type="password" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')okDel(${i})"><div class="err" id="pwe"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="okDel(${i})">Delete Bill</button></div>`);setTimeout(()=>$('#pw').focus(),50)}
function okDel(i){if(hsh('ps|'+$('#pw').value)!==ADMIN){$('#pwe').textContent='Wrong password. Bill not deleted.';return}H.splice(i,1);closeM();render();toast('Bill deleted')}
function exportH(){const b=new Blob([JSON.stringify(H)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PartySplit_History_Backup.json';document.body.appendChild(a);a.click();a.remove()}
function importH(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;x.forEach(b=>{if(b&&b.billId&&!H.some(h=>h.billId===b.billId))H.push(b)});H.sort((a,b)=>new Date(b.date)-new Date(a.date));render();toast('History restored ✓')}catch(e){toast('Invalid backup file',1)}};r.readAsText(f)}
function viewH(i){const b=H[i],c=calc(b);modal(`<h2>${b.billId}</h2><div style="margin:10px 0">${balTable(b,c)}</div><h3>Settlement</h3>${c.settle.map(t=>`<p class="tr" style="margin:6px 0">${esc(nm(b,t.from))} → ${esc(nm(b,t.to))} ${fmt(t.amt)}</p>`).join('')||'<p>All settled</p>'}<button class="btn" style="margin-top:14px" onclick="closeM()">Close</button>`)}

/* ---------- PDF ---------- */
function dl(b){
  if(!window.jspdf){return toast('PDF library failed to load. Check internet.',1)}
  const{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),c=calc(b),W=210,date=b.date?new Date(b.date):new Date();
  const navy=[16,26,52],gold=[200,153,58];
  d.setFillColor(...navy);d.rect(0,0,W,38,'F');d.setFillColor(...gold);d.rect(0,38,W,1.5,'F');
  d.setTextColor(255);d.setFont('times','bold');d.setFontSize(26);d.text('PARTYSPLIT',14,20);
  d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(230,192,107);d.text('PARTY EXPENSE BILL',14,28);
  d.setTextColor(255);d.text('Bill No: '+b.billId,W-14,18,{align:'right'});d.text(date.toLocaleString('en-IN'),W-14,25,{align:'right'});d.text('Total: '+rs(c.total),W-14,32,{align:'right'});
  let y=48;const H2=t=>{if(y>255){d.addPage();y=20}d.setTextColor(...navy);d.setFont('times','bold');d.setFontSize(14);d.text(t,14,y);d.setDrawColor(...gold);d.setLineWidth(.6);d.line(14,y+2,W-14,y+2);y+=6};
  const opt={theme:'striped',headStyles:{fillColor:navy,textColor:255},styles:{fontSize:9,cellPadding:2.5},margin:{left:14,right:14,bottom:20},didDrawPage:()=>{}};
  const nxt=()=>{y=d.lastAutoTable.finalY+9};
  H2('PEOPLE');d.autoTable({...opt,startY:y,head:[['#','Name']],body:b.people.map((p,i)=>[i+1,p.name])});nxt();
  H2('EXPENSE DETAILS');d.autoTable({...opt,startY:y,head:[['Expense','Amount','Paid By','Participants','Per person']],body:b.expenses.map(e=>{const s=Object.values(split(e.amt,e.cons));const lo=Math.min(...s),hi=Math.max(...s);return[e.name,rs(e.amt),nm(b,e.paidBy),e.cons.length,rs(lo)+(hi!==lo?' - '+rs(hi):'')]}),columnStyles:{1:{halign:'right'},4:{halign:'right'}}});nxt();
  H2('WHO CONSUMED WHAT');
  b.expenses.forEach(e=>{if(y+(b.people.length+1)*7+4>277){d.addPage();y=20}
    d.autoTable({...opt,startY:y,head:[[e.name+'  -  '+rs(e.amt),'Consumed','Share']],body:b.people.map(p=>{const s=split(e.amt,e.cons);const on=e.cons.includes(p.id);return[p.name,on?'Yes':'No',on?rs(s[p.id]):rs(0)]}),headStyles:{fillColor:[60,72,110],textColor:255},styles:{fontSize:8.5,cellPadding:2},rowPageBreak:'avoid',columnStyles:{1:{cellPadding:{left:10,top:2,bottom:2,right:2}},2:{halign:'right'}},
      didParseCell:h=>{if(h.section==='body'&&h.column.index===1){h.cell.styles.textColor=h.row.raw[1]==='Yes'?[20,140,90]:[200,50,70];h.cell.styles.fontStyle='bold'}},
      didDrawCell:h=>{if(h.section==='body'&&h.column.index===1){const x=h.cell.x+3.5,m=h.cell.y+h.cell.height/2;d.setLineWidth(.7);if(h.row.raw[1]==='Yes'){d.setDrawColor(20,140,90);d.line(x,m,x+1.8,m+2);d.line(x+1.8,m+2,x+5.2,m-2.2)}else{d.setDrawColor(200,50,70);d.line(x+.4,m-2,x+4.6,m+2);d.line(x+4.6,m-2,x+.4,m+2)}}}});y=d.lastAutoTable.finalY+5});
  y+=2;
  H2('INDIVIDUAL BREAKDOWN');d.autoTable({...opt,startY:y,head:[['Person','Total consumed','Total paid','Balance','Status']],body:b.people.map(p=>{const x=c.bal[p.id];return[p.name,rs(c.share[p.id]),rs(c.paid[p.id]),(x<0?'-':x>0?'+':'')+rs(x),x>0?'RECEIVE':x<0?'PAY':'SETTLED']}),columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},didParseCell:h=>{if(h.section==='body'&&h.column.index>=3){const v=c.bal[b.people[h.row.index].id];h.cell.styles.textColor=v>0?[20,140,90]:v<0?[200,50,70]:[90,90,90]}}});nxt();
  
  H2('FINAL SETTLEMENT');d.autoTable({...opt,startY:y,head:[['From','To','Amount','Status']],body:c.settle.map(t=>[nm(b,t.from),nm(b,t.to),rs(t.amt),(b.paid||{})[skey(t)]?'Paid':'Pending']).concat(c.settle.length?[]:[['All settled','','','']]),columnStyles:{2:{halign:'right'}}});
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){d.setPage(i);d.setDrawColor(...gold);d.setLineWidth(.3);d.line(14,281,W-14,281);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(130);
    d.text('Powered by PartySplit',14,287);d.text('Page '+i+' of '+n,W/2,287,{align:'center'});
    d.setFont('helvetica','italic');d.setTextColor(...navy);d.text('Bill generated by Mr. Abhinandan Singh Rajput',W-14,287,{align:'right'})}
  const ds=date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');
  d.save(`PartySplit_Bill_${ds}.pdf`);
  modal(`<div style="text-align:center"><svg class="tick" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/><path d="M19 33l9 9 17-19"/></svg><h2 style="margin:14px 0 6px">✅ Bill downloaded successfully!</h2><p style="color:var(--mu)">Check your downloads folder.</p><button class="btn pri" style="margin-top:14px" onclick="closeM()">Done</button></div>`)}

applyTheme();render();
</script></body></html>
