<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date &amp; Time Calculator — Abhi's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #080b14;
    --panel: #121a30;
    --violet: #7c5cfc;
    --violet-soft: #a68dff;
    --cyan: #4fd8eb;
    --gold: #f2b84b;
    --gold-soft: #ffd98a;
    --ink: #eaeaf5;
    --ink-dim: #8b93ad;
    --line: rgba(124,92,252,0.18);
    --danger: #ff6b6b;
    --good: #5be6a5;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--void);
    color: var(--ink);
    font-family:'Space Grotesk', sans-serif;
    padding: 28px 18px 60px;
  }

  .wrap{ max-width:760px; margin:0 auto; }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color: var(--ink-dim);
    text-decoration:none;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:.04em;
    margin-bottom:22px;
    transition: color .2s;
  }
  .back-link:hover{ color: var(--violet-soft); }

  .hero-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: var(--cyan);
    letter-spacing:.22em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size: clamp(24px, 5vw, 38px);
    margin:0 0 26px;
    background: linear-gradient(120deg, var(--ink) 20%, var(--violet-soft) 55%, var(--cyan) 80%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---- live clock card ---- */
  .clock-card{
    background: linear-gradient(180deg, var(--panel), rgba(18,26,48,0.6));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    margin-bottom:26px;
    text-align:center;
  }
  .clock-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color: var(--ink-dim);
    margin-bottom:12px;
  }
  .clock-date{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    color: var(--gold-soft);
    margin-bottom:8px;
  }
  .clock-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size: clamp(28px, 7vw, 46px);
    letter-spacing:.02em;
    color: var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:2px;
  }
  .clock-time .ms{
    font-size:0.42em;
    color: var(--cyan);
    min-width:3ch;
    text-align:left;
  }
  .clock-time .sec{ color: var(--violet-soft); }
  .clock-day{
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--ink-dim);
    letter-spacing:.06em;
  }

  /* ---- calculator card ---- */
  .calc-card{
    background: linear-gradient(180deg, var(--panel), rgba(18,26,48,0.6));
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px 30px;
  }
  .calc-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:18px;
  }

  .field-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .field{ flex:1 1 180px; }
  .field label{
    display:block;
    font-size:12px;
    color: var(--ink-dim);
    margin-bottom:6px;
    letter-spacing:.03em;
  }
  .field input, .field select{
    width:100%;
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(124,92,252,0.25);
    color: var(--ink);
    padding:12px 14px;
    border-radius:10px;
    font-size:15px;
    font-family:'Space Grotesk', sans-serif;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
    color-scheme: dark;
  }
  .field input:focus, .field select:focus{
    border-color: var(--violet-soft);
    box-shadow: 0 0 0 3px rgba(124,92,252,0.18);
  }

  .calc-btn{
    width:100%;
    padding:13px 14px;
    border:none;
    border-radius:10px;
    background: linear-gradient(135deg, var(--violet), #5b3dfa);
    color:white;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.02em;
    cursor:pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .calc-btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 24px -8px rgba(124,92,252,0.6); }
  .calc-btn:active{ transform: translateY(0); }

  .quick-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:-6px 0 18px;
  }
  .quick-chip{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: var(--ink-dim);
    background: rgba(124,92,252,0.1);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition: all .2s;
  }
  .quick-chip:hover{ color: var(--ink); border-color: var(--violet-soft); }

  /* ---- result ---- */
  .result{
    margin-top:24px;
    display:none;
  }
  .result.show{ display:block; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform: translateY(0); } }

  .result-headline{
    text-align:center;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: clamp(22px, 5vw, 30px);
    margin-bottom:4px;
  }
  .result-headline.future{ color: var(--cyan); }
  .result-headline.past{ color: var(--gold-soft); }
  .result-headline.today{ color: var(--good); }

  .result-sub{
    text-align:center;
    color: var(--ink-dim);
    font-size:12.5px;
    font-family:'JetBrains Mono', monospace;
    margin-bottom:20px;
  }

  .breakdown{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
    gap:10px;
  }
  .bd-cell{
    background: rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    text-align:center;
    padding:14px 6px;
  }
  .bd-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:22px;
    color: var(--violet-soft);
  }
  .bd-label{
    font-size:10.5px;
    color: var(--ink-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:4px;
  }

  footer{
    text-align:center;
    margin-top:34px;
    color: var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="javascript:history.back()">← Wapas Jao</a>

    <div class="hero-eyebrow">⏱ Utility Tool</div>
    <h1>Date &amp; Time Calculator</h1>

    <div class="clock-card">
      <div class="clock-label">Abhi ka Date &amp; Time</div>
      <div class="clock-date" id="clock-date">—</div>
      <div class="clock-time">
        <span id="clock-hms">--:--:--</span><span class="ms">.<span id="clock-ms">000</span></span>
      </div>
      <div class="clock-day" id="clock-day">—</div>
    </div>

    <div class="calc-card">
      <div class="calc-title">Kitne din baki hain / ho gaye?</div>

      <div class="quick-row" id="quick-row"></div>

      <div class="field-row">
        <div class="field">
          <label for="target-date">Target Date</label>
          <input type="date" id="target-date">
        </div>
        <div class="field">
          <label for="target-time">Time (optional)</label>
          <input type="time" id="target-time" step="1">
        </div>
      </div>

      <button class="calc-btn" id="calc-btn">Calculate</button>

      <div class="result" id="result">
        <div class="result-headline" id="result-headline">—</div>
        <div class="result-sub" id="result-sub">—</div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>

    <footer>Live clock milliseconds tak accurate hai · Local device time use ho raha hai</footer>
  </div>

<script>
  /* ---------- live clock (with seconds + milliseconds) ---------- */
  const clockDate = document.getElementById('clock-date');
  const clockHms = document.getElementById('clock-hms');
  const clockMs = document.getElementById('clock-ms');
  const clockDay = document.getElementById('clock-day');

  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function pad(n, len){ return String(n).padStart(len || 2, '0'); }

  function tickClock(){
    const now = new Date();
    clockDate.textContent = `${pad(now.getDate())}-${monthNames[now.getMonth()]}-${now.getFullYear()}`;
    clockHms.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    clockMs.textContent = pad(now.getMilliseconds(), 3);
    clockDay.textContent = dayNames[now.getDay()];
    requestAnimationFrame(tickClock);
  }
  requestAnimationFrame(tickClock);

  /* ---------- quick date chips ---------- */
  const quickRow = document.getElementById('quick-row');
  const targetDateInput = document.getElementById('target-date');
  const targetTimeInput = document.getElementById('target-time');

  function isoDate(d){
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  const quickOptions = [
    { label:'Kal', days:1 },
    { label:'+7 din', days:7 },
    { label:'+30 din', days:30 },
    { label:'Is saal ka end', special:'year-end' },
    { label:'Naya saal', special:'new-year' }
  ];

  quickOptions.forEach(opt => {
    const chip = document.createElement('div');
    chip.className = 'quick-chip';
    chip.textContent = opt.label;
    chip.addEventListener('click', () => {
      const now = new Date();
      let d;
      if(opt.special === 'year-end'){
        d = new Date(now.getFullYear(), 11, 31);
      } else if(opt.special === 'new-year'){
        d = new Date(now.getFullYear()+1, 0, 1);
      } else {
        d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+opt.days);
      }
      targetDateInput.value = isoDate(d);
      targetTimeInput.value = '';
      runCalculation();
    });
    quickRow.appendChild(chip);
  });

  /* ---------- calculation ---------- */
  const calcBtn = document.getElementById('calc-btn');
  const resultEl = document.getElementById('result');
  const resultHeadline = document.getElementById('result-headline');
  const resultSub = document.getElementById('result-sub');
  const breakdown = document.getElementById('breakdown');

  function runCalculation(){
    if(!targetDateInput.value){
      targetDateInput.focus();
      return;
    }
    const [y, m, d] = targetDateInput.value.split('-').map(Number);
    let hh = 0, mm = 0, ss = 0;
    if(targetTimeInput.value){
      const parts = targetTimeInput.value.split(':').map(Number);
      hh = parts[0] || 0; mm = parts[1] || 0; ss = parts[2] || 0;
    }
    const target = new Date(y, m-1, d, hh, mm, ss, 0);
    const now = new Date();
    let diffMs = target.getTime() - now.getTime();

    const isToday = target.toDateString() === now.toDateString() && !targetTimeInput.value;
    const isPast = diffMs < 0;
    diffMs = Math.abs(diffMs);

    const totalSeconds = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    resultEl.classList.add('show');

    const dateLabel = `${pad(d)}-${monthNames[m-1]}-${y}`;

    if(isToday){
      resultHeadline.className = 'result-headline today';
      resultHeadline.textContent = 'Aaj hi hai! 🎉';
      resultSub.textContent = `Target date: ${dateLabel}`;
    } else if(isPast){
      resultHeadline.className = 'result-headline past';
      resultHeadline.textContent = `${days} din pehle ho chuka`;
      resultSub.textContent = `${dateLabel} nikal chuki hai — beete hue time ka breakdown neeche hai`;
    } else {
      resultHeadline.className = 'result-headline future';
      resultHeadline.textContent = `${days} din baaki hain`;
      resultSub.textContent = `Aaj se ${dateLabel} tak — poora breakdown neeche hai`;
    }

    breakdown.innerHTML = '';
    const cells = [
      { num: days, label:'Days' },
      { num: hours, label:'Hours' },
      { num: minutes, label:'Minutes' },
      { num: seconds, label:'Seconds' }
    ];
    cells.forEach(c => {
      const cell = document.createElement('div');
      cell.className = 'bd-cell';
      cell.innerHTML = `<div class="bd-num">${c.num}</div><div class="bd-label">${c.label}</div>`;
      breakdown.appendChild(cell);
    });
  }

  calcBtn.addEventListener('click', runCalculation);

  // default target date = today, so field isn't empty
  const todayNow = new Date();
  targetDateInput.value = isoDate(todayNow);
</script>
</body>
</html>
